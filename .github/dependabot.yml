version: 2

updates:
  # Xavfsizlik ogohlantirishlari chiqqanda Dependabot o'zi PR ochadi va CI
  # uni darhol sinovdan o'tkazadi — `npm audit` ni qo'lda eslab yurish
  # shart bo'lmaydi.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Har bir kichik yangilanish uchun alohida PR shovqin bo'ladi:
    # patch va minor bittaga birlashtiriladi, major esa alohida keladi —
    # u odatda qo'lda tekshirishni talab qiladi.
    groups:
      minor-va-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # Workflow'dagi action versiyalari ham eskiradi
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
