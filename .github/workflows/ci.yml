name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Bir branchga ketma-ket push qilinganda eskisini kutib o'tirmaymiz
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Brauzer testlari bu yerda ishlamaydi: ular haqiqiy API'ga boradi va
  # ularni CI'ga ulash uchun repozitoriyaga API manzilini sir sifatida
  # qo'shish kerak bo'lardi. Playwright lokalda `npm run test:e2e` bilan
  # ishlaydi — README'dagi "Browser tests" bo'limiga qarang.
  checks:
    name: Types, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      # `build` skripti avval `tsc -b` ni bajaradi, ya'ni tiplar ham shu
      # yerda tekshiriladi — alohida qadam kerak emas
      - name: Build
        run: npm run build
